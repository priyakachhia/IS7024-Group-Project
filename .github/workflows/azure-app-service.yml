name: Build, test, and deploy to Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test application services
        run: dotnet test "Cincy_Biz_Advisor.Tests/Cincy_Biz_Advisor.Tests.csproj" --configuration Release

      - name: Test Razor Pages and server endpoints
        # The web test hosts share a local SQLite database.
        run: >-
          dotnet test "Cincy Biz Advisor.Tests/Cincy Biz Advisor.Tests.csproj" --configuration Release
          --filter "FullyQualifiedName!~PlaywrightSmokeTests&FullyQualifiedName!~Acceptance.HomePageAcceptanceTests|FullyQualifiedName~ValidBusinessTypesRedirectToAnalyzeWithDecodedSelectedValues|FullyQualifiedName~RedirectLocationContainsEncodedNeighborhoodAndBusinessTypeValues"
          -- xUnit.ParallelizeTestCollections=false

      - name: Publish web app
        run: dotnet publish "Cincy Biz Advisor/Cincy Biz Advisor.csproj" --configuration Release --no-restore --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: metro-biz-advisor
          path: publish/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    concurrency: azure-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metro-biz-advisor
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
